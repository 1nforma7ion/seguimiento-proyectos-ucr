name: sondeo
on: workflow_dispatch
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probar acceso al portal desde GitHub
        run: |
          python - <<'PY'
          import re
          from datetime import date
          from recolector.portal import Portal, TARGET_RUTA
          p = Portal()
          html = p.consultar_autor(2950, date(2023, 12, 10), date(2027, 1, 1))
          nums = [n for n in re.findall(r"\b\d{4,5}/[A-Z]/\d{2}\b", html) if not n.startswith("0000")]
          print("expedientes en la página 1:", len(set(nums)))
          ruta = p.postback(TARGET_RUTA.format(0))
          print("la ruta trae 'Estado:':", "Estado:" in ruta)
          assert nums and "Estado:" in ruta
          PY
